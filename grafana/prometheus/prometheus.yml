global:
  scrape_interval: 15s

scrape_configs:

  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "kafka"
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: "kafka-brokers"
    metrics_path: /probe
    params:
      module: [kafka]
    static_configs:
      - targets:
          - broker-1:9092
          - broker-2:9092
          - broker-3:9092
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: "airflow"
    metrics_path: /probe
    params:
      module: [airflow]
    static_configs:
      - targets:
          - airflow-apiserver:8080
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: "synapse"
    static_configs:
      - targets: ["host.docker.internal:9102"]

  - job_name: "airflow-exporter"
    static_configs:
      - targets: ["airflow-exporter:9101"]

  - job_name: "databricks"
    static_configs:
      - targets: ["host.docker.internal:9103"]